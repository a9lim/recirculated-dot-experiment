[project]
name = "recirculated-dot-experiment"
version = "0.1.0"
description = "Experiments for recirculated dots."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "CC-BY-SA-4.0"
license-files = ["LICENSE"]
authors = [{ name = "a9lim", email = "mx@a9l.im" }]
# flash-attn is a hard import of the wire (D10) but deliberately not
# declared here: it is machine-owned (jobe's venv pins the prebuilt wheel
# via constraints.txt) and has no universal wheels to resolve elsewhere.
dependencies = [
    "torch>=2.8",
    # ~= pin: the wire drives Gemma3 layer internals and relies on private
    # contracts (layer returns a tensor, cache.update(k,v,idx), sdpa maskless
    # q_len==1 semantics); bump only with the G0 identity gate green
    "transformers~=5.15.1",
    "datasets>=4.6",
]

[tool.setuptools]
packages = ["recirculated_dot_experiment"]
